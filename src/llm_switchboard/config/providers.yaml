# Health scoring configuration
health:
  polling_interval_seconds: 60
  cache_ttl_seconds: 30
  status_page_weight: 0.6
  probe_weight: 0.3
  community_weight: 0.1
  degraded_threshold: 0.7    # Below this → degraded
  down_threshold: 0.3        # Below this → down

# Model equivalence — capability-aware substitution scoring
# Higher score = better substitute
equivalence:
  tiers:
    flagship: [flagship]                          # Only swap flagship for flagship
    balanced: [balanced, flagship]                # balanced can use flagship as fallback
    fast: [fast, balanced]                        # fast can use balanced
    reasoning: [reasoning, flagship]              # reasoning models prefer reasoning tier
    reasoning_fast: [reasoning_fast, reasoning]   # fast reasoning prefers full reasoning
